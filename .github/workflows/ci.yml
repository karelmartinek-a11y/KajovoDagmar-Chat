name: quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  KAJOVODAGMAR_ROOT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  KAJOVODAGMAR_INITIALIZATION_SECRET_HASH: '87a559183b8458084db697d3e6f7e05da1b0e6e807ea2ee9f0cc6b94c650e126'
jobs:
  source-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.13'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: '0.12.0'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.2', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm install --global npm@10.9.8
      - run: make bootstrap
      - run: make source-check format-check lint typecheck test test-contract
  integration:
    runs-on: ubuntu-24.04
    needs: source-and-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.13'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: '0.12.0'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.2'}
      - run: npm install --global npm@10.9.8
      - run: |
          ./scripts/install_ci_security_tools.sh "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - run: make bootstrap
      - run: docker compose -f deployment/compose.test.yaml up -d --wait
      - run: KAJOVODAGMAR_DATABASE_URL=postgresql+asyncpg://kajovodagmar:test-only-password@127.0.0.1:55432/kajovodagmar_test KAJOVODAGMAR_TEST_DATABASE_URL=postgresql+asyncpg://kajovodagmar:test-only-password@127.0.0.1:55432/kajovodagmar_test make migrate test-integration test-security test-ai
  release-gate:
    runs-on: ubuntu-24.04
    needs: integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.13'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: '0.12.0'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.2'}
      - run: npm install --global npm@10.9.8
      - run: |
          ./scripts/install_ci_security_tools.sh "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - run: make bootstrap
      - run: npx --prefix web playwright install --with-deps chromium webkit
      - env:
          POSTGRES_PASSWORD: release-check-password
          PGBACKREST_REPO1_CIPHER_PASS: synthetic-release-check-backup-encryption-passphrase
          ACME_EMAIL: ci@example.invalid
          APP_IMAGE: kajovodagmar:release-candidate
        run: make release-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: release-evidence, path: release/evidence/generated, if-no-files-found: error}
  deploy-production:
    runs-on: ubuntu-24.04
    needs: release-gate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    environment:
      name: production
      url: https://chat.hcasc.cz
    steps:
      - name: Configure isolated production SSH identity
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          install -d "$RUNNER_TEMP/kajovodagmar-chat-ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/kajovodagmar-chat-ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/kajovodagmar-chat-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/kajovodagmar-chat-ssh/id_ed25519" >/dev/null
      - name: Deploy exact verified commit
        env:
          PASS: ${{ secrets.PASS }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          : "${PASS:?production environment secret PASS is required}"
          printf '%s' "$PASS" | base64 --wrap=0 | ssh \
            -i "$RUNNER_TEMP/kajovodagmar-chat-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/kajovodagmar-chat-ssh/known_hosts" \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sudo -n /usr/local/sbin/deploy-kajovodagmar-chat ${{ github.sha }}"
      - name: Remove ephemeral SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/kajovodagmar-chat-ssh/id_ed25519"
