name: autonomous-mobile-voice-acceptance
on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/e2e/**'
      - 'backend/src/kajovodagmar/realtime/**'
      - 'backend/src/kajovodagmar/providers/**'
      - 'scripts/**'
      - 'deployment/**'
      - '.github/workflows/mobile-voice-acceptance.yml'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit to test
        required: false
        type: string
      iterations:
        description: Deterministic acceptance iterations
        required: false
        default: '5'
        type: string
      background_seconds:
        description: Android background duration
        required: false
        default: '10'
        type: string
      run_live_provider_probe:
        description: Run server-side provider probe (requires production workflow)
        required: false
        default: false
        type: boolean
      run_real_device_cloud:
        description: Reserved for configured real-device cloud
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: autonomous-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12.13'}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with: {version: '0.12.0'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22.23.2'}
      - run: npm install --global npm@10.9.8
      - run: make bootstrap
      - run: npx --prefix web playwright install --with-deps chromium webkit
      - name: Start Android emulator
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --name codex-api35 --package "system-images;android-35;google_apis;x86_64" --force
          emulator -avd codex-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/codex-android-emulator.log 2>&1 &
          adb wait-for-device
          until adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; do sleep 2; done
          adb shell input keyevent 82
      - name: Build isolated acceptance image
        run: |
          npm --prefix web run build
          docker build --tag kajovodagmar:acceptance --file deployment/Dockerfile .
          docker build --tag kajovodagmar-postgres:17-pgbackrest-2.59.0 --file deployment/Dockerfile.postgres .
      - name: Run isolated browser and chaos acceptance
        env:
          ITERATIONS: ${{ inputs.iterations || '5' }}
          APP_IMAGE: kajovodagmar:acceptance
          RUN_WEBKIT: 'true'
          ANDROID_EMULATOR_REQUIRED: 'true'
          BACKGROUND_SECONDS: ${{ inputs.background_seconds || '10' }}
        run: make autonomous-voice-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: autonomous-mobile-voice-evidence
          path: release/evidence/generated
          if-no-files-found: warn
